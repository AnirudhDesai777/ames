name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AMES_STUB: "1"

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.27"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked ruff check server
      - run: uv run --locked ruff format --check server
      - run: uv run --locked pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

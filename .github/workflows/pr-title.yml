name: pr-title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|chore|refactor|test|perf|build|ci|style|revert)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "PR title must follow Conventional Commits, got: $TITLE"; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Rebase merges put every commit on main, so each one must be clean too.
      - name: Check every commit message
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            subject=$(git log -1 --format=%s "$c")
            echo "$subject" | grep -Eq '^(feat|fix|docs|chore|refactor|test|perf|build|ci|style|revert)(\([a-z0-9-]+\))?!?: .+' \
              || { echo "Not a Conventional Commit: $c $subject"; fail=1; }
            git log -1 --format=%B "$c" | grep -qi '^co-authored-by:' \
              && { echo "Attribution trailer not allowed: $c"; fail=1; }
          done
          exit $fail

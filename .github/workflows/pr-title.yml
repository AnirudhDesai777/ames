name: pr-title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|chore|refactor|test|perf|build|ci|style|revert)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "PR title must follow Conventional Commits, got: $TITLE"; exit 1; }

      The supported minimum is Apple Silicon with 24 GB; the reference machine is a MacBook Pro M4 Pro 24 GB.
      16 GB is not claimed because no 16 GB machine is available to test, so S8 is a load test only. There is
      one model set and no reduced profile.
    evidence:

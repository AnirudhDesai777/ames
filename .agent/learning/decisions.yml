  - id: DECISION-051
    date: "2026-11-22"
    status: APPROVED
    topic: Distillation method
    decision: >-
      Off-policy distillation is not working. Move to on-policy training: the student generates and a teacher
      grades whole replies (reply-level, not token-level), so the teacher need not share the student's
      tokenizer. This replaces the training method in DECISION-011; its ship rule stands.
    evidence:
      - "Maintainer: \"what if the teacher only cheks the smaller model's replies instead of chekcing at the token level\""
      - "Lead agent session notes, 2026-11-22"
    source: USER_DECISION
    supersedes: []
    superseded_by: null
    originating_task: Distillation


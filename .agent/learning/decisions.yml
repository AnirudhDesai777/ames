    date: "2026-11-24"
    status: APPROVED
    topic: Training judge calibration
    decision: >-
      Before training, measure how often GLM 5.3 agrees with Claude verdicts on student replies to dev
      prompts. Held-out prompts are never used for calibration.
    evidence:
      - "Maintainer answer, 2026-11-24 session: chose \"Yes, calibrate first\""
    source: USER_DECISION
    supersedes: []
    superseded_by: null
    originating_task: Distillation

  - id: DECISION-056
    date: "2026-11-24"
    status: APPROVED
    topic: Distillation stages
    decision: >-
      Round 1 is best-of-n: the student samples N replies per prompt, GLM 5.3 scores each whole reply, and the
      student is fine-tuned on the top reply. Round 2 is DPO on best and worst pairs. GRPO is added only if
      both rounds stall. Starting with DPO or GRPO was rejected.
    evidence:
      - "Maintainer answer, 2026-11-24 session: chose \"Best-of-n, then DPO\""
    source: USER_DECISION
    supersedes: []
    superseded_by: null
    originating_task: Distillation


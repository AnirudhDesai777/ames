# Maintainer decisions. Read .agent/README.md before editing.
# Only decisions whose approval traces to the maintainer belong here.
schema_version: 1
decisions:
  - id: DECISION-001
    date: "2026-11-07"
    status: SUPERSEDED
    topic: Original product concept
    decision: >-
      The first design draft made Ames a voice companion with three roles (thought partner, study buddy,
      emotional companion), a sassy and warm personality, six moods, laughs and sighs through Orpheus tags,
      Qwen3-8B as the LLM, a 16 GB minimum, and Chrome plus Safari. Each part was later replaced; see the
      decisions that cite this one.
    evidence:
      - "PR #11 (first design draft, merged)"
      - "git 0397e6e docs/design.md (first draft)"
    source: USER_DECISION
    supersedes: []
    superseded_by: DECISION-036
    originating_task: Design v1

  - id: DECISION-002
    date: "2026-11-07"
    status: APPROVED
    topic: v1 platform
    decision: >-
      v1 targets macOS on Apple Silicon and Chrome only. Windows, Linux, NVIDIA and Docker move to v1.1 and
      Firefox and Safari to v1.x. Docker was rejected for the main install because it cannot reach the Mac GPU.
    evidence:
      - "docs/design.md#3-owner-decisions-fixed (Platform row; section says 'Decided by the maintainer and not open for review')"
      - "docs/roadmap.md"
      - "PR #14"
      - "issue #6"
      - "https://app.notion.com/p/41179cd5f9f4817e8177ca979e9acda9"
    source: USER_DECISION
    supersedes: []
    superseded_by: null
    originating_task: Design v4

  - id: DECISION-003
    date: "2026-11-07"
    status: APPROVED
    topic: Model runtime
    decision: >-
      Every model with an MLX build runs on MLX inside the single server process, the LLM through mlx-lm.
      Rejected: an mlx-lm HTTP server as a child process (a second listener to secure, less cache and cancel
      control), Ollama, and llama.cpp.
    evidence:
      - "docs/design.md#3-owner-decisions-fixed (Runtime row)"
      - "docs/design.md#12-alternatives-considered"
      - "https://app.notion.com/p/41179cd5f9f4817e8177ca979e9acda9"
      - "https://app.notion.com/p/41179cd5f9f481d7a726de206bac30df (article: LLM runs in-process)"
    source: USER_DECISION
    supersedes: []
    superseded_by: null
    originating_task: Design v4

  - id: DECISION-004
    date: "2026-11-07"
    status: APPROVED
    topic: Content policy and guardrails
    decision: >-
      No topic refusals and no age gate. Exactly five guardrails: G1 crisis exit, G2 no sexual content
      involving minors, G3 no step-by-step mass-casualty weapon instructions, G4 says she is an AI when
      sincerely asked, G5 first-run advisory. G2 and G4 wording was trimmed in design v8.
    evidence:
      - "docs/design.md#3-owner-decisions-fixed (Content and Guardrails rows)"
      - "docs/design.md#83-guardrails"
      - "https://app.notion.com/p/41179cd5f9f4815d8d32ceea686e77bb"

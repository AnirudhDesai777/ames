  - id: DECISION-013
    date: "2026-11-07"
    status: APPROVED
    topic: Crisis exit
    decision: >-
      On a crisis=1 turn the server discards the reply, speaks one fixed line from persona/ames.md pointing to
      local emergency services, and ends the session. Rejected: sticky crisis mode, a per-country hotline list,
      locale mapping, and a bare refusal line. No phone numbers live in the repo.
    evidence:
      - "https://app.notion.com/p/41179cd5f9f481cea0b2e38a52856a84 (row asked by the maintainer)"
      - "PR #16"
      - "docs/design.md#84-crisis-exit"
      - "issue #34"
    source: USER_DECISION
    supersedes: []
    superseded_by: null
    originating_task: Design v4


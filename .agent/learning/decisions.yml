      VCTK CC BY 4.0) and a male voice (marius, CC0) toggled in the web UI, a clear voice, no emotion controls
      and no voice cloning. Qwen3-TTS was rejected as slow and tiring in conversation. Cosette and other
      Expresso or EARS voices are rejected for their CC BY-NC licence.

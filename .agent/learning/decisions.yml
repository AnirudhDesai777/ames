  - id: DECISION-039
    date: "2026-11-12"
    status: APPROVED
    topic: Context summarising
    decision: >-
      When history nears the 3000-token cap the LLM summarises the oldest turns while idle and the summary is
      swapped in at the trim; user speech cancels it, the fallback is plain drop-off, the summary stays in
      server memory and never feeds extraction, and the conversation continues on the same connection and
      session_id. In v1 scope, not built.
    evidence:
      - "docs/design.md#55-context-management: \"Summarising continues on the same connection and `session_id` (confirmed 2026-11-12).\""
      - "PR #108"
      - "PR #109"
    source: USER_DECISION
    supersedes: []
    superseded_by: null
    originating_task: Design v8


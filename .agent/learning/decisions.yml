  - id: DECISION-010
    date: "2026-11-07"
    status: APPROVED
    topic: LLM size and choosing models by numbers
    decision: >-
      Use a smaller middle LLM than Qwen3-8B, fine-tuned with a teacher approach, and choose it with benchmarks
      and evals rather than impressions. A smaller model also lowers the RAM need.
    evidence:
      - "https://app.notion.com/p/41179cd5f9f48196b501c4791b7c9cde"
      - "Maintainer: \"for the cascading model, lets reduce the middle llm. qwen 3 8b is an overkill, a smaller model which can be fintuned using teach decision approach will have the same capaibility. we do need to design benchmarks and evals so that we know the model which we are choosing is based on numbers and not on vibes, and benchamrk and eval design is a big part of agntic design\""
      - "Maintainer: \"this will also reduce the amount of ram we need\""
      - "issue #12"
    source: USER_DECISION
    supersedes: []
    superseded_by: null
    originating_task: Design v1 review

  - id: DECISION-011
    date: "2026-11-07"
    status: APPROVED
    topic: Slice D fine-tune
    decision: >-
      Run the bake-off of small base models first and fine-tune the winner by teacher-student distillation
      (slice D). D ships only if it beats the winner's own bake-off scores on held-out sets, and it is off the
      v1 path unless a v1 gate needs it; the smaller fine-tuned LLM is after v1 (#29). The training method
      (teacher writes replies, off-policy) was replaced by DECISION-051; the ship rule here still stands.
    evidence:
      - "docs/design.md#3-owner-decisions-fixed (Fine-tuning row)"
      - "https://app.notion.com/p/41179cd5f9f481219a58faa5363a1f11"
      - "issue #29"
      - "docs/roadmap.md"
    source: USER_DECISION
    supersedes: []
    superseded_by: null
    originating_task: Design v4


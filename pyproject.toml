[project]
name = "ames-voice"
version = "0.1.0"
description = "Local voice companion"
requires-python = ">=3.12,<3.13"
dependencies = ["aiohttp==3.14.5", "pipecat-ai[webrtc]==1.15.0"]

[project.optional-dependencies]
mac = [
  "mlx-audio==0.6.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.4"]

[tool.pytest.ini_options]
testpaths = ["server/tests", "evals/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

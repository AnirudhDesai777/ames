<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 300" width="1020" height="300" role="img" aria-label="C4 context: the user talks to Ames on their own Mac. The only data that leaves the Mac is opt-in web search queries." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>C4 context: the user talks to Ames on their own Mac. The only data that leaves the Mac is opt-in web search queries.</title><defs><marker id="head-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="head-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker></defs><rect x="268" y="24" width="476" height="252" rx="14" fill="none" stroke="#8c959f" stroke-dasharray="6 5"/><text x="284" y="46" font-size="12" font-weight="600" fill="#59636e" text-anchor="start">Your Mac</text><circle cx="96.0" cy="104" r="13" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><rect x="16" y="122" width="160" height="64" rx="18" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="96.0" y="143.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">User</text><text x="96.0" y="160.0" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">Talks by voice</text><text x="96.0" y="176.0" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">or text</text><rect x="316" y="84" width="380" height="140" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="506.0" y="119.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Ames</text><text x="506.0" y="136.0" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">Software system</text><text x="506.0" y="155.0" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle">Local voice agent in Chrome.</text><text x="506.0" y="171.0" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle">Speech to text, language model and</text><text x="506.0" y="187.0" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle">text to speech run on this Mac.</text><text x="506.0" y="203.0" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle">Listens on 127.0.0.1:8765 only.</text><rect x="836" y="52" width="168" height="84" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1" stroke-dasharray="5 4"/><text x="920.0" y="83.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Search services</text><text x="920.0" y="100.0" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">SearXNG, then Brave</text><text x="920.0" y="119.0" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle">Off by default</text><rect x="836" y="180" width="168" height="84" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1" stroke-dasharray="5 4"/><text x="920.0" y="211.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Hugging Face</text><text x="920.0" y="228.0" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">Planned: ames setup</text><text x="920.0" y="247.0" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle">Model weights</text><polyline points="176,154 312,154" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#head-text)"/><text x="222" y="112" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">speaks,</text><text x="222" y="125" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">types,</text><text x="222" y="138" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">listens</text><polyline points="696,120 832,94" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#head-line)"/><text x="790" y="84" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">opt-in</text><text x="790" y="97" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">queries</text><polyline points="832,222 700,196" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#head-line)"/><text x="790" y="232" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">planned</text><text x="790" y="245" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">download</text></svg>

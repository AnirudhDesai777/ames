<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="One spoken turn: audio goes to speech to text, the transcript goes to the language model, and each complete sentence goes to text to speech and plays while the next one is written." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>One spoken turn: audio goes to speech to text, the transcript goes to the language model, and each complete sentence goes to text to speech and plays while the next one is written.</title><defs><marker id="head-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="head-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker></defs><circle cx="80.0" cy="22" r="13" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><rect x="20" y="40" width="120" height="30" rx="18" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="80.0" y="60.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">You</text><line x1="80" y1="72" x2="80" y2="410" stroke="#d1d9e0" stroke-dasharray="4 4"/><rect x="190" y="18" width="140" height="40" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="260.0" y="43.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Chrome page</text><line x1="260" y1="66" x2="260" y2="410" stroke="#d1d9e0" stroke-dasharray="4 4"/><rect x="370" y="18" width="140" height="40" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="440.0" y="43.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Speech to text</text><line x1="440" y1="66" x2="440" y2="410" stroke="#d1d9e0" stroke-dasharray="4 4"/><rect x="550" y="18" width="140" height="40" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="620.0" y="43.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Language model</text><line x1="620" y1="66" x2="620" y2="410" stroke="#d1d9e0" stroke-dasharray="4 4"/><rect x="730" y="18" width="140" height="40" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="800.0" y="43.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Text to speech</text><line x1="800" y1="66" x2="800" y2="410" stroke="#d1d9e0" stroke-dasharray="4 4"/><polyline points="80,104 256,104" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#head-text)"/><text x="170.0" y="97" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">speak</text><polyline points="260,144 436,144" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#head-text)"/><text x="350.0" y="137" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">mic audio, WebRTC</text><polyline points="440,184 616,184" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#head-text)"/><text x="530.0" y="177" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">transcript and session history</text><rect x="40" y="206" width="800" height="128" rx="10" fill="#f6f8fa" fill-opacity="0.6" stroke="#8c959f"/><text x="56" y="224" font-size="11" font-weight="600" fill="#59636e" text-anchor="start">for each complete sentence</text><polyline points="620,248 796,248" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#head-text)"/><text x="710.0" y="241" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">sentence</text><polyline points="800,284 264,284" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#head-text)"/><text x="530.0" y="277" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">speech, WebRTC</text><polyline points="260,318 84,318" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#head-text)"/><text x="170.0" y="311" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">plays</text><rect x="40" y="352" width="800" height="40" rx="10" fill="#ddf4ff" stroke="#0969da"/><text x="440" y="377" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle">Speak for 300 ms or more and Ames stops talking and listens.</text></svg>

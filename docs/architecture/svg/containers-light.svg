 x="556.0" y="473.0" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle">Token, Host, Origin checks</text><rect x="728" y="160" width="224" height="176" rx="14" fill="none" stroke="#8c959f" stroke-dasharray="6 5"/><text x="744" y="182" font-size="12" font-weight="600" fill="#59636e" text-anchor="start">Models, in process (MLX)</text><rect x="744" y="188" width="192" height="40" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="840.0" y="213.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Parakeet TDT 0.6B</text><rect x="744" y="236" width="192" height="40" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="840.0" y="261.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">mlx-lm, AMES_LLM_MODEL</text><rect x="744" y="284" width="192" height="40" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="840.0" y="309.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Pocket TTS 100M</text><rect x="728" y="356" width="224" height="56" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="840.0" y="381.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Session history</text><text x="840.0" y="398.0" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">In memory, this session only</text><rect x="728" y="428" width="224" height="64" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="840.0" y="449.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Tools</text><text x="840.0" y="466.0" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">remember, recall_memory,</text><text x="840.0" y="485.0" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle">get_time, web_search</text><path d="M560,563 a120.0,7 0 0,0 240,0 a120.0,7 0 0,0 -240,0 v50 a120.0,7 0 0,0 240,0 v-50" fill="#ffffff" stroke="#d1d9e0"/><text x="680.0" y="594.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">ames.db</text><text x="680.0" y="610.0" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">SQLite, saved facts</text><rect x="1008" y="408" width="156" height="76" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1" stroke-dasharray="5 4"/><text x="1086.0" y="435.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Search services</text><text x="1086.0" y="452.0" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">SearXNG, Brave</text><text x="1086.0" y="471.0" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle">Opt-in</text><polyline points="144,82 144,176" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#head-text)"/><polyline points="252,214 440,214" fill="none" stroke="#0969da" stroke-width="1.5" marker-end="url(#head-accent)"/><text x="346" y="206" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">mic audio, typed text</text><polyline points="440,254 256,254" fill="none" stroke="#0969da" stroke-width="1.5" marker-end="url(#head-accent)"/><text x="346" y="272" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">speech, transcript, events</text><text x="346" y="288" font-size="11" font-weight="normal" fill="#0969da" text-anchor="middle">WebRTC</text><polyline points="252,448 440,448" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#head-line)"/><text x="346" y="440" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">page, offer, memories</text><text x="346" y="466" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">HTTP + token</text><polyline points="556,400 556,284" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#head-line)"/><text x="612" y="346" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">starts and</text><text x="612" y="360" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">ends sessions</text><polyline points="668,232 700,232" fill="none" stroke="#8c959f" stroke-width="1.5"/><polyline points="700,208 700,460" fill="none" stroke="#8c959f" stroke-width="1.5"/><polyline points="700,208 740,208" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#head-line)"/><polyline points="700,256 740,256" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#head-line)"/><polyline points="700,304 740,304" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#head-line)"/><polyline points="700,384 724,384" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#head-line)"/><polyline points="700,460 724,460" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#head-line)"/><polyline points="840,492 840,588 804,588" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#head-line)"/><text x="888" y="548" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">remember,</text><text x="888" y="562" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">recall</text><polyline points="520,492 520,588 556,588" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#head-line)"/><text x="474" y="548" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">list, delete</text><polyline points="952,460 1004,446" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#head-line)"/><text x="980" y="432" font-size="11" font-weight="normal" fill="#59636e" text-anchor="middle">queries</text></svg>

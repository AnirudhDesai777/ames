<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" width="1180" height="660" role="img" aria-label="C4 containers: Chrome talks to one local Python server over HTTP and WebRTC. Models run in process. Saved facts go to ames.db. Web search is opt-in." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>C4 containers: Chrome talks to one local Python server over HTTP and WebRTC. Models run in process. Saved facts go to ames.db. Web search is opt-in.</title><defs><marker id="head-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="head-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker></defs><circle cx="144.0" cy="14" r="13" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><rect x="44" y="32" width="200" height="50" rx="18" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="144.0" y="62.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">User</text><rect x="12" y="104" width="972" height="540" rx="14" fill="none" stroke="#8c959f" stroke-dasharray="6 5"/><text x="28" y="126" font-size="12" font-weight="600" fill="#59636e" text-anchor="start">Your Mac</text><rect x="28" y="140" width="240" height="380" rx="14" fill="none" stroke="#8c959f" stroke-dasharray="6 5"/><text x="44" y="162" font-size="12" font-weight="600" fill="#59636e" text-anchor="start">Chrome</text><rect x="44" y="180" width="208" height="320" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="148.0" y="265.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Web client</text><text x="14